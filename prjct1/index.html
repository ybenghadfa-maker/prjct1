<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #dce7f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 220px;
            background: #ffffff;
            padding: 12px;
            border-radius: 9px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .qr-box {
            width: 100%;
            height: 100%;
            border-radius: 9px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2f80ed;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .content {
            text-align: center;
            padding: 20px 0 12px 0;
        }

        .content h5 {
            color: #1f2d45;
            line-height: 1.25;
            margin-bottom: 17px;
            font-weight: 900;
        } 

        #shadow {
            color: #7a8492;
            font-size: 9px;
            line-height: 1.2;
            font-weight: 700;
        }

    </style>
</head>

<body>

    <div class="card">

        <div class="qr-box">
            <img src="image-qr-code.png" alt="QR Code">
        </div>

        <div class="content">
            <h5>
                Improve your front-end<br>
                skills by building projects
            </h5>
            <p id="shadow">
                Scan the QR code to visit Frontend<br>
                Mentor and take your coding skills to<br>
                the next level
            <p>
            
        </div>

    </div>
            
</body>
</html>
